<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart TPE & Apple Pay</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/pos-terminal.png">

    <style>
        /* =========================================
           STYLES DU TPE (SMART TPE)
           ========================================= */
        :root {
            --bg-color: #0A0A0C;
            --surface-color: #16161A;
            --accent-color: #2F80ED;
            --success-color: #00E676;
            --error-color: #FF453A;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --key-bg: #212124;
            --key-bg-active: #2C2C30;
            
            /* Apple Pay variables */
            --ap-bg: #000000;
            --ap-accent: #007aff;
            --ap-success: #34c759;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- TPE CONTAINER --- */
        .tpe-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 24px;
            padding-top: env(safe-area-inset-top, 40px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .header-menu { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; z-index: 100; }
        .selected-mode { font-size: 16px; font-weight: 600; color: var(--text-main); background: var(--surface-color); padding: 8px 20px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .dropdown-content { display: none; position: absolute; top: 100%; margin-top: 10px; background-color: var(--surface-color); border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); width: 180px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; }
        .dropdown-content.show { display: block; animation: fadeIn 0.2s ease; }
        .dropdown-item { padding: 14px 16px; font-size: 16px; font-weight: 500; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: #fff; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:active { background-color: var(--key-bg-active); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .display-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 200px; transition: all 0.3s ease; }
        .terminal-logo, .pass-visual { display: flex; justify-content: center; align-items: center; margin-bottom: 16px; color: var(--text-muted); opacity: 0.6; transition: all 0.2s ease; }
        .pass-visual { display: none; opacity: 0.8; color: var(--accent-color); }
        .payment-logo { width: 42px; height: 42px; }
        .pass-logo { width: 80px; height: 80px; }
        .amount-display { font-size: 48px; font-weight: 700; letter-spacing: -1px; margin-bottom: 5px; transition: transform 0.2s ease; }
        .status-message { font-size: 15px; color: var(--text-muted); font-weight: 400; }
        .nfc-animation { display: none; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
        .nfc-wave-icon { width: 64px; height: 64px; fill: var(--accent-color); animation: pulseWave 1.6s infinite; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .key { background-color: var(--key-bg); border: none; border-radius: 16px; height: 64px; font-size: 24px; font-weight: 500; color: var(--text-main); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background-color 0.1s ease, transform 0.1s ease; }
        .key:active { background-color: var(--key-bg-active); transform: scale(0.96); }
        .key.btn-delete { font-size: 18px; color: #FF453A; }
        .key.btn-confirm { background-color: var(--accent-color); color: white; }
        .key.btn-confirm:active { background-color: #1b63c4; }

        @keyframes pulseWave { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }

        .success-checkmark-tpe, .error-cross-tpe { display: none; width: 72px; height: 72px; border-radius: 50%; justify-content: center; align-items: center; margin-bottom: 20px; animation: popInTPE 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .success-checkmark-tpe { background-color: var(--success-color); }
        .error-cross-tpe { background-color: var(--error-color); }
        .success-checkmark-tpe svg { width: 36px; height: 36px; fill: #000; }
        .error-cross-tpe svg { width: 36px; height: 36px; stroke: #000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        
        @keyframes popInTPE { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        #tap-zone { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; z-index: 9999; }

        /* =========================================
           STYLES DU SIMULATEUR APPLE PAY (INTÉGRÉ)
           ========================================= */
        #apple-pay-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--ap-bg);
            color: #fff;
            overflow: hidden;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
        }

        .ap-top-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: max(20px, env(safe-area-inset-top));
            z-index: 30;
        }

        /* ZONE FACE ID (Positionnée en HAUT)[cite: 2] */
        .top-action-zone {
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            width: 100%;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .face-id-container {
            width: 52px;
            height: 52px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .face-id-svg {
            width: 100%;
            height: 100%;
            stroke: #8e8e93;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }

        .face-id-container.scanning .face-id-svg {
            stroke: var(--ap-accent);
            animation: faceIdPulse 1s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes faceIdPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .status-text {
            margin-top: 14px;
            font-size: 15px;
            color: #fff;
            font-weight: 400;
            min-height: 20px;
            text-align: center;
            letter-spacing: -0.2px;
        }

        .success-checkmark {
            display: none;
            width: 56px;
            height: 56px;
            background: var(--ap-success);
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-checkmark svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: #fff;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.3s 0.1s forwards ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes drawCheck {
            100% { stroke-dashoffset: 0; }
        }

        /* CONTAINER DE LA CARTE (Au centre / bas)[cite: 2] */
        .card-container {
            width: 100%;
            padding: 0 22px;
            padding-bottom: max(40px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            perspective: 1000px;
        }

        /* Style Carte Mastercard Black / Titanium Premium avec Logo Apple[cite: 2] */
        .credit-card {
            width: 100%;
            max-width: 356px;
            height: 224px;
            background: linear-gradient(135deg, #121317 0%, #1f2128 40%, #2a2c36 70%, #0d0e11 100%);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.5s ease;
        }

        .credit-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Envol de la carte vers le haut (Dynamic Island)[cite: 2] */
        .credit-card.fly-up {
            transform: translateY(-120vh) scale(0.15);
            opacity: 0;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .chip {
            width: 46px;
            height: 34px;
            background: linear-gradient(135deg, #e6c687 0%, #b89753 100%);
            border-radius: 7px;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
        }

        .chip::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.25);
        }

        /* Logo Apple officiel argenté sur la carte[cite: 2] */
        .apple-logo-card {
            width: 24px;
            height: 24px;
            fill: rgba(255, 255, 255, 0.85);
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }

        .card-middle {
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-number {
            font-size: 21px;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            font-family: "Courier New", Courier, monospace;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .card-holder {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.65);
            font-weight: 600;
        }

        /* Logo Mastercard Officiel[cite: 2] */
        .mastercard-logo {
            display: flex;
            align-items: center;
        }

        .mastercard-logo .circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .mastercard-logo .circle-red {
            background-color: #eb001b;
            margin-right: -11px;
        }

        .mastercard-logo .circle-yellow {
            background-color: #f79e1b;
            opacity: 0.92;
        }
    </style>
</head>
<body>

    <!-- =========================================
         SECTION 1 : SMART TPE
         ========================================= -->
    <div class="tpe-container" id="tpe-view">
        <div class="header-menu">
            <div class="selected-mode" id="selected-mode" onclick="toggleMenu('tpe')">
                Paiement ▾
            </div>
            <div class="dropdown-content" id="dropdown-menu-tpe">
                <div class="dropdown-item" onclick="setMode('paiement')">Paiement</div>
                <div class="dropdown-item" onclick="setMode('pourboire')">Pourboire</div>
                <div class="dropdown-item" onclick="setMode('cb')">CB</div>
                <div class="dropdown-item" onclick="setMode('pass')">Pass</div>
            </div>
        </div>

        <div class="display-area" id="display-area">
            <div class="terminal-logo" id="terminal-logo">
                <svg class="payment-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2" />
                    <line x1="2" y1="10" x2="22" y2="10" />

            </div>

            <div class="pass-visual" id="pass-visual">
                <svg class="pass-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>

            <div class="success-checkmark-tpe" id="success-icon-tpe">

            <div class="error-cross-tpe" id="error-icon-tpe">
                <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>

            <div class="amount-display" id="amount-display">0,00 €</div>
            <div class="status-message" id="status-message">Saisir un montant</div>

            <div class="nfc-animation" id="nfc-container">
                <svg class="nfc-wave-icon" viewBox="0 0 24 24">
                    <path d="M2 12c0-5.52 4.48-10 10-10s10 4.48 10 10-4.48 10-10 10-10-4.48-10-10zm1.5 0c0 4.69 3.81 8.5 8.5 8.5s8.5-3.81 8.5-8.5-3.81-8.5-8.5-8.5-8.5 3.81-8.5 8.5zm3 0c0-3.04 2.46-5.5 5.5-5.5s5.5 2.46 5.5 5.5-2.46 5.5-5.5 5.5-5.5-2.46-5.5-5.5zm1.5 0c0 2.21 1.79 4 4 4s4-1.79 4-4-1.79-4-4-4-4 1.79-4 4z"/>
                </svg>
            </div>
        </div>

        <div class="keypad" id="keypad">
            <button class="key" onclick="pressNum('1')">1</button>
            <button class="key" onclick="pressNum('2')">2</button>
            <button class="key" onclick="pressNum('3')">3</button>
            <button class="key" onclick="pressNum('4')">4</button>
            <button class="key" onclick="pressNum('5')">5</button>
            <button class="key" onclick="pressNum('6')">6</button>
            <button class="key" onclick="pressNum('7')">7</button>
            <button class="key" onclick="pressNum('8')">8</button>
            <button class="key" onclick="pressNum('9')">9</button>
            <button class="key btn-delete" onclick="pressDelete()">⌫</button>
            <button class="key" onclick="pressNum('0')">0</button>
            <button class="key btn-confirm" onclick="pressValidate()">✓</button>
        </div>
    </div>
    
    <div id="tap-zone" onclick="triggerTPEMoneyPayment()"></div>

    <!-- =========================================
         SECTION 2 : SIMULATEUR APPLE PAY (CB) SANS BOUTON RETOUR, AVEC MENU DE SÉLECTION
         ========================================= -->
    <div id="apple-pay-view">
        <div class="ap-top-bar">
            <div class="header-menu">
                <div class="selected-mode" id="selected-mode-ap" onclick="toggleMenu('ap')">
                    CB ▾
                </div>
                <div class="dropdown-content" id="dropdown-menu-ap">
                    <div class="dropdown-item" onclick="setMode('paiement')">Paiement</div>
                    <div class="dropdown-item" onclick="setMode('pourboire')">Pourboire</div>
                    <div class="dropdown-item" onclick="setMode('cb')">CB</div>
                    <div class="dropdown-item" onclick="setMode('pass')">Pass</div>
                </div>
            </div>
        </div>

        <!-- ZONE FACE ID (EN HAUT)[cite: 2] -->
        <div class="top-action-zone" id="actionZone">
            <div class="face-id-container" id="faceIdIcon">
                <svg class="face-id-svg" viewBox="0 0 50 50">
                    <path d="M 6,16 V 10 A 4,4 0 0 1 10,6 H 16" ></path>
                    <path d="M 34,6 H 40 A 4,4 0 0 1 44,10 V 16" ></path>
                    <path d="M 6,34 V 40 A 4,4 0 0 0 10,44 H 16" ></path>
                    <path d="M 34,44 H 40 A 4,4 0 0 0 44,40 V 34" ></path>
                    <path d="M 17,20 V 22" ></path>
                    <path d="M 33,20 V 22" ></path>
                    <path d="M 25,18 V 28 H 22" ></path>
                    <path d="M 18,34 Q 25,39 32,34" ></path>
                </svg>
            </div>
            <div class="success-checkmark" id="successCheckmark">
                <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="status-text" id="statusText"></div>
        </div>

        <!-- CARTE MASTERCARD BLACK AVEC LOGO APPLE (CENTRE/BAS)[cite: 2] -->
        <div class="card-container">
            <div class="credit-card" id="card">
                <div class="card-top">
                    <div class="chip"></div>
                    <svg class="apple-logo-card" viewBox="0 0 170 170">

                    </svg>
                </div>
                <div class="card-middle">
                    <div class="card-number">•••• •••• •••• 9812</div>
                </div>
                <div class="card-bottom">
                    <div class="card-holder">BLACK EDITION</div>

                        <div class="circle circle-red"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================================
         SCRIPTS
         ========================================= -->
    <script>
        /* -------------------------------------------
           LOGIQUE SMART TPE
           ------------------------------------------- */
        let amount = "0";
        let state = "input"; 
        let currentMode = "paiement";
        let forceSuccess = false; 

        const tpeView = document.getElementById("tpe-view");
        const applePayView = document.getElementById("apple-pay-view");

        const amountDisplay = document.getElementById("amount-display");
        const statusMessage = document.getElementById("status-message");
        const nfcContainer = document.getElementById("nfc-container");
        const successIconTPE = document.getElementById("success-icon-tpe");
        const errorIconTPE = document.getElementById("error-icon-tpe"); 
        const tapZone = document.getElementById("tap-zone");
        const keypad = document.getElementById("keypad");
        const terminalLogo = document.getElementById("terminal-logo");
        const passVisual = document.getElementById("pass-visual");
        
        const menuTpe = document.getElementById("dropdown-menu-tpe");
        const menuAp = document.getElementById("dropdown-menu-ap");
        const modeLabelTpe = document.getElementById("selected-mode");
        const modeLabelAp = document.getElementById("selected-mode-ap");

        function toggleMenu(which) {
            if (which === 'tpe') {
                menuTpe.classList.toggle("show");
                menuAp.classList.remove("show");
            } else {
                menuAp.classList.toggle("show");
                menuTpe.classList.remove("show");
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.selected-mode')) {
                if (menuTpe.classList.contains('show')) menuTpe.classList.remove('show');
                if (menuAp.classList.contains('show')) menuAp.classList.remove('show');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            menuTpe.classList.remove("show");
            menuAp.classList.remove("show");

            let labelText = "Paiement ▾";
            if(mode === 'pass') labelText = "Pass ▾";
            if(mode === 'pourboire') labelText = "Pourboire ▾";
            if(mode === 'cb') labelText = "CB ▾";

            modeLabelTpe.innerText = labelText;
            modeLabelAp.innerText = labelText;
            
            if (mode === 'cb') {
                tpeView.style.display = "none";
                applePayView.style.display = "flex";
                bringCardBack();
            } else {
                tpeView.style.display = "flex";
                applePayView.style.display = "none";
                resetTPE();
            }
        }

        function updateScreen() {
            let formatted = (parseFloat(amount) / 100).toFixed(2);
            amountDisplay.innerText = formatted.replace(".", ",") + " €";
        }

        function pressNum(num) {
            if (state !== "input" || currentMode === "pass") return;
            if (amount === "0") amount = num;
            else if (amount.length < 8) amount += num;
            updateScreen();
        }

        function pressDelete() {
            if (state !== "input" || currentMode === "pass") return;
            if (amount.length > 1) amount = amount.slice(0, -1);
            else amount = "0";
            updateScreen();
        }

        function pressValidate() {
            if (state !== "input" || amount === "0" || currentMode === "pass") return;
            state = "waiting";
            statusMessage.innerText = "Présentez votre carte";
            keypad.style.opacity = "0.1"; 
            keypad.style.pointerEvents = "none";
            nfcContainer.style.display = "flex";
            terminalLogo.style.opacity = "0.2"; 
            tapZone.style.display = "block";
        }

        function playBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(1550, context.currentTime);
                gain.gain.setValueAtTime(0.2, context.currentTime);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start();
                oscillator.stop(context.currentTime + 0.12);
            } catch(e) {}
        }

        function playErrorBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(300, context.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(150, context.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, context.currentTime);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start();
                oscillator.stop(context.currentTime + 0.4);
            } catch(e) {}
        }

        function triggerTPEMoneyPayment() {
            let isSuccess = true;
            if (!forceSuccess && Math.random() < 0.25) {
                isSuccess = false;
                forceSuccess = true; 
            } else { forceSuccess = false; }

            if (currentMode === "pass" && state === "input") {
                state = "processing";
                tapZone.style.display = "none";
                statusMessage.innerText = "Vérification...";
                setTimeout(() => {
                    statusMessage.innerText = "Approbation...";
                    setTimeout(() => {
                        passVisual.style.display = "none";
                        if (isSuccess) {
                            playBeep();
                            state = "success";
                            successIconTPE.style.display = "flex";
                            statusMessage.innerText = "APPROUVÉ";
                            statusMessage.style.color = "var(--success-color)";
                        } else {
                            playErrorBeep();
                            state = "error";
                            errorIconTPE.style.display = "flex";
                            statusMessage.innerText = "REFUSÉ";
                            statusMessage.style.color = "var(--error-color)";
                        }
                        setTimeout(() => { resetTPE(); }, 3500);
                    }, 1200);
                }, 800);
                return;
            }

            if (state !== "waiting") return;
            state = "processing";
            tapZone.style.display = "none";
            nfcContainer.style.display = "none";
            terminalLogo.style.display = "none"; 
            statusMessage.innerText = "Traitement en cours...";
            setTimeout(() => {
                statusMessage.innerText = "Autorisation...";
                setTimeout(() => {
                    amountDisplay.style.display = "none";
                    if (isSuccess) {
                        playBeep();
                        state = "success";
                        successIconTPE.style.display = "flex";
                        statusMessage.innerText = "Paiement validé";
                        statusMessage.style.color = "var(--success-color)";
                    } else {
                        playErrorBeep();
                        state = "error";
                        errorIconTPE.style.display = "flex";
                        statusMessage.innerText = "PAIEMENT REFUSÉ";
                        statusMessage.style.color = "var(--error-color)";
                    }
                    setTimeout(() => { resetTPE(); }, 3500);
                }, 1200);
            }, 800);
        }

        function resetTPE() {
            amount = "0";
            state = "input";
            successIconTPE.style.display = "none";
            errorIconTPE.style.display = "none"; 
            nfcContainer.style.display = "none";
            if (currentMode === "pass") {
                keypad.style.opacity = "0";
                keypad.style.pointerEvents = "none";
                amountDisplay.style.display = "none";
                terminalLogo.style.display = "none";
                passVisual.style.display = "flex";
                statusMessage.innerText = "Présentez le pass";
                statusMessage.style.color = "var(--text-muted)";
                tapZone.style.display = "block";
            } else {
                keypad.style.opacity = "1";
                keypad.style.pointerEvents = "auto";
                amountDisplay.style.display = "block";
                terminalLogo.style.display = "flex";
                terminalLogo.style.opacity = "0.6";
                passVisual.style.display = "none";
                statusMessage.innerText = currentMode === "pourboire" ? "Saisir le pourboire" : "Saisir un montant";
                statusMessage.style.color = "var(--text-muted)";
                tapZone.style.display = "none";
                updateScreen();
            }
        }
        resetTPE();

        /* -------------------------------------------
           LOGIQUE SIMULATEUR APPLE PAY (INTÉGRÉ)[cite: 2]
           ------------------------------------------- */
        const card = document.getElementById('card');
        const faceIdIcon = document.getElementById('faceIdIcon');
        const successCheckmark = document.getElementById('successCheckmark');
        const statusText = document.getElementById('statusText');
        const actionZone = document.getElementById('actionZone');
        const applePayViewEl = document.getElementById('apple-pay-view');

        let apState = 'idle'; // 'idle', 'scanning', 'success', 'gone'

        function playApplePaySound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';

                osc1.frequency.setValueAtTime(1046.50, ctx.currentTime);
                osc2.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);

                osc1.start(ctx.currentTime);
                osc2.start(ctx.currentTime + 0.08);
                osc1.stop(ctx.currentTime + 0.35);
                osc2.stop(ctx.currentTime + 0.35);
            } catch (e) {}
        }

        function handleScreenClick(e) {
            // Empêche le déclenchement de Face ID si on clique sur le menu déroulant
            if (e.target.closest('.header-menu') || e.target.closest('.dropdown-content')) return;

            if (apState === 'idle') {
                startFaceIDProcess();
            } else if (apState === 'gone') {
                bringCardBack();
            }
        }

        function startFaceIDProcess() {
            apState = 'scanning';
            faceIdIcon.classList.add('scanning');
            statusText.textContent = "";

            setTimeout(() => {
                apState = 'success';
                playApplePaySound();

                faceIdIcon.style.display = 'none';
                successCheckmark.style.display = 'flex';
                statusText.textContent = "Terminé";

                setTimeout(() => {
                    card.classList.add('fly-up');
                    actionZone.style.opacity = '0';
                    
                    setTimeout(() => {
                        apState = 'gone';
                    }, 600);
                }, 800);

            }, 1200);
        }

        function bringCardBack() {
            apState = 'idle';
            card.classList.remove('fly-up');
            actionZone.style.opacity = '1';
            faceIdIcon.classList.remove('scanning');
            faceIdIcon.style.display = 'flex';
            successCheckmark.style.display = 'none';
            statusText.textContent = "";
        }

        applePayViewEl.addEventListener('click', handleScreenClick);
    </script>
</body>
</html>
